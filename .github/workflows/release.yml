# 버전 태그(v1.3.1 등)를 올리면 GitHub 서버가 설치파일을 만들어 Release 에 올린다.
# 각 PC 의 프로그램은 실행할 때 최신 Release 를 확인해 업데이트를 알려 준다.
name: 설치파일 만들기

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 openpyxl pyinstaller

      - name: Inno Setup 설치
        run: choco install innosetup -y --no-progress

      - name: 버전 결정
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v","V")
          if ("${{ github.ref_type }}" -ne "tag") {
            $v = (Select-String -Path app/version.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 빌드
        env:
          PYTHONUTF8: "1"
        run: python tools/build.py --version ${{ steps.ver.outputs.version }}

      - name: 변경 내용 (CHANGELOG.md)
        env:
          PYTHONUTF8: "1"
        run: python tools/notes.py ${{ steps.ver.outputs.version }} > dist/release_notes.md

      - name: Release 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 지출이 ${{ steps.ver.outputs.version }}
          files: dist/*.exe
          body_path: dist/release_notes.md
